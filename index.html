body{color:#fff;font:22px/1.25 var(--tx);-webkit-font-smoothing:none}
#app{max-width:900px;margin:0 auto;padding:16px}
.tag{text-align:center;font:8px/1.8 var(--px);margin-top:10px;text-shadow:2px 2px 0 #000}
.ti{margin:12px 0 6px;text-align:center;font:clamp(21px,6vw,39px)/1.6 var(--px);color:var(--au);text-shadow:3px 3px 0 var(--in2),6px 6px 0 #000}
.st{height:14px;max-width:460px;margin:12px auto;border:3px solid #000;background:linear-gradient(90deg,var(--in) 0 33.3%,var(--pk) 33.3% 66.6%,var(--au) 66.6%)}
.sub{text-align:center;font-size:26px;margin:8px 0 18px;text-shadow:2px 2px 0 #000}
.box{background:#0a1a3eeb;border:4px solid var(--au);box-shadow:0 0 0 4px #000,8px 8px 0 4px #000a;padding:16px;margin:0 6px 22px}
h3{font:11px var(--px);color:var(--au);margin:4px 0 10px}
label{display:block;font:9px var(--px);color:#bcd3ff;margin:14px 0 8px}
input{font:24px var(--tx);padding:4px 10px;border:3px solid #000;background:#fff;color:var(--ink);width:210px}
button{font:10px/1.5 var(--px);padding:12px 14px;margin:4px;background:var(--in);color:#fff;border:0;cursor:pointer;box-shadow:inset -4px -4px 0 #0005,inset 4px 4px 0 #fff4,0 0 0 3px #000}
button:hover{filter:brightness(1.15)}button:active{transform:translate(2px,2px)}button:disabled{opacity:.45;cursor:default;filter:none}
button.on{outline:4px solid #fff;outline-offset:2px}
button.go{background:var(--au);color:var(--ink)}
.fmt{display:flex;flex-wrap:wrap;gap:10px}.fmt button{flex:1 1 150px;padding:16px 8px;margin:4px}.fmt small{display:block;font:20px var(--tx);margin-top:6px}
.bT{background:var(--in)}.bO{background:var(--pk)}.bW{background:var(--au);color:var(--ink)}
.seg{display:flex;flex-wrap:wrap}
.mu{margin:4px 0 8px;line-height:1.3}
.top{display:flex;justify-content:space-between;gap:8px;font:10px var(--px);margin-bottom:10px;text-shadow:2px 2px 0 #000}
.pl{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.p{flex:1 1 100px;background:#0a1a3eeb;border:3px solid #000;box-shadow:0 0 0 3px var(--in2);padding:8px;text-align:center;font:9px/1.8 var(--px)}
.p b{font:16px var(--px);color:var(--au)}
.p.ld{box-shadow:0 0 0 3px var(--au)}.p.out{opacity:.4;text-decoration:line-through}
.msg{font:11px/1.8 var(--px);text-align:center;margin:12px 0;text-shadow:2px 2px 0 #000}
.ban{font:16px/1.8 var(--px);text-align:center;color:var(--au);margin:14px 0;text-shadow:3px 3px 0 #000}
.grid{display:flex;flex-wrap:wrap;gap:26px;justify-content:center}
.cw{text-align:center;font:10.8px/2 var(--px);text-shadow:2px 2px 0 #000}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.mini{display:inline-block;width:14px;height:20px;border:2px solid #000;background:repeating-linear-gradient(45deg,var(--au) 0 3px,var(--in2) 3px 6px);vertical-align:middle;margin-right:4px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 16px;max-width:660px;margin:0 auto}.g2 .cd{width:100%}.g2.odd .cw:last-child{grid-column:1/-1;justify-self:center;width:calc((100% - 16px)/2)}
.cd{container-type:inline-size;position:relative;width:min(310px,100%);aspect-ratio:2/3;background:#fff;border:1px solid #231f20;border-radius:3.6%/2.4%;box-shadow:0 6px 14px #0008;color:#000;text-align:left;text-shadow:none}
.cd.win{outline:3px solid var(--au);outline-offset:3px}.fl{animation:fl .5s}@keyframes fl{from{transform:rotateY(90deg)}}
.fr{font:italic 700 4.6cqw/1 "Helvetica Neue",Helvetica,Arial,sans-serif;color:#000;position:absolute;left:2.7%;top:2.4%;width:94.8%;height:94.7%;border:1px solid #231f20;border-radius:3.2cqw;overflow:hidden;background:#fff}
.ph{position:absolute;left:0;top:0;width:100%;height:71.7%;background:linear-gradient(#a9c3de,#6785ad 60%,#445f83);display:flex;align-items:center;justify-content:center}
.ph i{font:italic 800 46cqw/1 "Helvetica Neue",Helvetica,Arial,sans-serif;color:#fff3}
.nm{position:absolute;left:0;top:4.7%;width:93%;height:10.7%;display:flex;align-items:center;padding-left:1.6cqw;background:linear-gradient(180deg,#ffe6cfd9,#f0bf98d9);border-radius:0 3cqw 3cqw 0}
.nm span,.fm{color:#fff;-webkit-text-stroke:.5cqw #000;paint-order:stroke fill;white-space:nowrap;font-style:italic;font-weight:700}
.fm{position:absolute;left:0;top:71.7%;width:100%;height:7.2%;background:#3e56a6;display:flex;align-items:center;justify-content:center;font-size:5.3cqw}
.sp{position:absolute;left:0;top:78.9%;width:100%;bottom:0;background:linear-gradient(180deg,#e9d08a,#fff5c6 48%,#fbc926)}
.sil{position:absolute;left:51%;top:17%;height:54%;aspect-ratio:36/89.5;transform:translateX(-50%)}
.g{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(5,1fr);grid-auto-flow:column;column-gap:9cqw;padding:1.4cqw 3.2cqw 1.2cqw 4.2cqw}
.s{display:flex;align-items:center;padding-left:.6cqw;border-radius:1.2cqw}.s span{flex:1;white-space:nowrap}.s b{width:12cqw}
.s.pk{cursor:pointer}.s.pk:hover{background:#ffe27a}.s.sel{background:#e8671a;color:#fff}.s.selw{background:#1a9b46}
.pn{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:#0a1a3ec7;border-radius:14px;padding:7px 14px;margin-bottom:9.6px;box-shadow:0 0 0 2px #000;text-shadow:none;vertical-align:bottom}
.msg{background:#0a1a3ec7;border-radius:14px;padding:10px 14px;text-shadow:none}
.bb{position:sticky;bottom:58px;z-index:4;flex-wrap:nowrap;justify-content:center;gap:10px;background:#0a1a3ee6;border-radius:14px;padding:8px;box-shadow:0 0 0 2px #000}.bb button{flex:1 1 0;margin:0;max-width:200px;padding-left:6px;padding-right:6px}
button{min-height:44px}
html{-webkit-text-size-adjust:100%}body{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#rot{display:none;position:fixed;inset:0;z-index:99;background:#0a1a3e;color:var(--au);font:12px/2.2 var(--px);text-align:center;align-items:center;justify-content:center;padding:20px}
@media(orientation:landscape) and (max-height:520px){#rot{display:flex}}

function deal(m,ps){ps.forEach(p=>p.hand=[]);shuf([...Array(D[m].c.length).keys()]).forEach((c,i)=>ps[i%ps.length].hand.push(c));return{mode:m,ps,lead:0,ph:"pick",pot:[],rd:1,rev:null,over:null,dl:m==="W"?Date.now()+20000:0}}
function sync(){if(R&&H)R.emit("st",S).catch(()=>{});if(S&&S.over&&!S.rec&&H){S.rec=1;recordGame()}saveG();render();botMove();clearTimeout(at);if(H&&R&&S&&S.ph==="rev"&&!S.over)at=setTimeout(()=>{if(S.ph==="rev")nxt()},7000)}
function pick(st){if(S.ph!=="pick")return;hfm=false;const act=S.ps.filter(p=>p.hand.length),m=D[S.mode].c;
const vals=act.map(p=>({id:p.id,c:p.hand[0],v:sv(m[p.hand[0]],st)})),mx=Math.max(...vals.map(x=>x.v)),w=vals.filter(x=>x.v===mx);
S.rev={st,vals,w:w.length===1?w[0].id:null,n:vals.length+S.pot.length};
act.forEach(p=>p.hand.shift());const tops=vals.map(x=>x.c);
if(w.length===1){const p=S.ps.find(p=>p.id===w[0].id);p.hand.push(...shuf(tops.concat(S.pot)));S.pot=[];S.lead=S.ps.indexOf(p)}else S.pot.push(...tops);
S.ph="rev";sync()}
function nxt(){if(!H||!S||S.ph!=="rev"||S.fo)return;S.rd++;const a=S.ps.filter(p=>p.hand.length),R_=RULES[S.mode];
if(a.length<2){a.sort((x,y)=>y.hand.length-x.hand.length);S.over=a.length?a[0].name:"Nobody";S.winId=a.length?a[0].id:null;S.ph="end";return sync()}
if(R_.cap&&S.rd>R_.cap){a.sort((x,y)=>y.hand.length-x.hand.length);if(a[0].hand.length===a[1].hand.length){S.over="Match tied";S.how="tied";S.winId=null}else{S.over=a[0].name;S.winId=a[0].id;S.how="rounds"}S.ph="end";return sync()}
while(!S.ps[S.lead].hand.length)S.lead=(S.lead+1)%S.ps.length;S.ph="pick";S.rev=null;S.dl=R_.tl?Date.now()+R_.tl*1000:0;sync()}
function botMove(){if(!H||!S||S.lobby||S.fo||S.ph!=="pick")return;const p=S.ps[S.lead];if(!p.bot)return;clearTimeout(bt);
bt=setTimeout(()=>{if(S.fo||S.ph!=="pick"||S.ps[S.lead]!==p)return;const ci=p.hand[0],sc=STS[S.mode].map((_,i)=>[pr[S.mode][i][ci],i]).sort((a,b)=>b[0]-a[0]);
pick(Math.random()<BP?sc[0][1]:sc[Math.random()*5|0][1])},1400)}
setInterval(()=>{if(!S||S.lobby||S.over||S.ph!=="pick"||!S.dl)return;if(S.fo){S.dl+=250;return}const r=Math.max(0,Math.ceil((S.dl-Date.now())/1000)),e=$("tm");if(e){e.textContent=r;e.parentNode.classList.toggle("lo",r<=5)}if(r<=0&&H){S.dl=0;pick(Math.random()*STS[S.mode].length|0)}},250);
let hfm=false;
function hfOpen(){hfm=true;render()}
function hfClose(){hfm=false;render()}
function hfPick(i){hfm=false;act(i)}
function hfModal(){if(!hfm||!S||S.lobby||S.over||S.ph!=="pick")return"";const mi=S.ps.find(p=>p.id===me.id);if(!mi||!mi.hand.length||S.ps[S.lead].id!==me.id)return"";const x=D[S.mode].c[mi.hand[0]];
return `<div class="mdl"><div class="box"><h3>PICK ONE</h3><button class="go" onclick="hfPick(5)">100s: ${x[6]}</button><button class="go" onclick="hfPick(6)">50s: ${x[7]}</button><button onclick="hfClose()">CANCEL</button></div></div>`}
function act(i){if(!S||S.fo||S.ph!=="pick"||S.ps[S.lead].id!==me.id)return;if(R&&!H)R.emit("pk",{id:me.id,s:i}).catch(()=>{});else pick(i)}
function topP(){const m=Math.max(...S.ps.map(p=>p.hand.length)),t=S.ps.filter(p=>p.hand.length===m);return t.length===1?t[0]:null}
function canFo(){if(!S||S.lobby||S.over||S.fo||!H)return false;const p=S.ps.find(p=>p.id===me.id),t=topP();return !!(p&&p.hand.length&&t&&t!==p&&!(S.nf&&S.nf[me.id]>S.rd))}
function doFo(id){const p=S.ps.find(p=>p.id===id);if(!p||S.fo||S.over)return;S.fo={id,name:p.name};sync();const t=topP();if(t&&t.bot)setTimeout(()=>decFo(true),1200)}
function decFo(ok){if(!S||!S.fo)return;const t=topP();if(ok&&t){S.over=t.name;S.winId=t.id;S.how="forfeit";S.ph="end"}else{S.nf=S.nf||{};S.nf[S.fo.id]=S.rd+3}S.fo=null;sync()}
function startSP(){nameIn();LS.d("sp-menu");const bn=["Bot Bumrah","Bot Dhoni","Bot Warne"];H=true;R=null;
S=deal(mode,[{id:me.id,name:myName()},...bn.slice(0,nb).map((n,i)=>({id:"b"+i,name:n,bot:1}))]);sync()}
async function host(){nameIn();say("Creating table…");
try{if(!hasRoom())return say("Online tables only work on the published page.");
const ro=await claude.use("room");if(!ro)return say("Online play isn’t available for this viewer.");
const al="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let code="";for(let i=0;i<4;i++)code+=al[Math.random()*al.length|0];
R=await ro.join("ct-"+code.toLowerCase());H=true;S={lobby:1,mode,code,ps:[{id:me.id,name:myName()}]};
R.on("jn",m=>{const d=m.data;if(!d||!d.id)return;if(S.lobby&&!S.ps.find(p=>p.id===d.id)&&S.ps.length<6)S.ps.push({id:String(d.id).slice(0,12),name:String(d.name||"Guest").slice(0,14)});sync()});
R.on("pk",m=>{const d=m.data;if(!d||S.lobby||S.ph!=="pick"||S.ps[S.lead].id!==d.id||!(d.s>=0&&d.s<11))return;pick(d.s|0)});
setInterval(()=>R.emit("st",S).catch(()=>{}),3000);sync()}catch(e){H=false;S=null;say("Couldn’t open a table ("+((e&&e.code)||"error")+"). Try again.")}}
async function joinT(){nameIn();const code=($("tc").value||"").trim().toLowerCase();if(!code)return say("Enter the table code.");
try{if(!hasRoom())return say("Online tables only work on the published page.");
const ro=await claude.use("room");if(!ro)return say("Online play isn’t available for this viewer.");
R=await ro.join("ct-"+code);H=false;
R.on("st",m=>{if(m.isMe)return;if(!hp)hp=m.peer;if(m.peer!==hp)return;S=m.data;render()});
const hi=()=>R.emit("jn",{id:me.id,name:myName()}).catch(()=>{});hi();say("Joining table "+code.toUpperCase()+"… (ask the host to stay on the lobby screen)");
const t=setInterval(()=>{if(S)clearInterval(t);else hi()},1500)}catch(e){say("Couldn’t join that table ("+((e&&e.code)||"error")+").")}}
function say(t){const e=$("sm");if(e)e.textContent=t}
function startMP(){S=deal(S.mode,S.ps.map(p=>({id:p.id,name:p.name})));sync()}
function again(){S=deal(S.mode,S.ps.map(p=>({id:p.id,name:p.name,bot:p.bot})));sync()}
function setMode(k){nameIn();mode=k;render()}function setNb(n){nameIn();nb=n;render()}

const FM={T:"TEST MATCHES",O:"ONE-DAY INTERNATIONALS",W:"T20 INTERNATIONALS"};
function cd(c,o={}){const d=D[S.mode],x=d.c[c],M=STS[S.mode],nf=Math.min(10.5,105/x[0].length).toFixed(2),cl=i=>o.sel===i||(i==="hf"&&(o.sel===5||o.sel===6))?(o.win?"sel selw":"sel"):"";
const cells=CELLS.map(i=>i==="hf"?`<div class="s ${cl(i)} ${o.pick?"pk":""}" ${o.pick?`onclick="hfOpen()"`:""}><span>100s/50s:</span><b>${x[6]}/${x[7]}</b></div>`:`<div class="s ${cl(i)} ${o.pick?"pk":""}" ${o.pick?`onclick="act(${i})"`:""}><span>${i===10&&x[2]===2?"Ct/St":(M[i][3]||M[i][0])}:</span><b>${dv(x,i)}</b></div>`).join("");
const pic=PIC[slug(x[0])];
return `<div class="cd ${o.win?"win":""} ${o.sel>=0?"fl":""}"><div class="fr"><div class="ph"><i>${ini(x[0])}</i>${pic?`<img class="pic" src="${pic}" alt="">`:""}</div><div class="nm"><span style="font-size:${nf}cqw">${esc(x[0]).toUpperCase()}</span></div><div class="fm">${FM[S.mode]}</div><div class="sp"><svg class="sil" viewBox="0 0 36 89.5"><use href="#silp"/></svg><div class="g">${cells}</div></div></div><div class="fg"><img src="${FL[x[1]]}" alt="${x[1]}"></div></div>`}
function setup(){const ds={T:"No clock. Play until one player holds every card",O:"No clock. 50 rounds, most cards wins",W:"Rush mode. 20 seconds a pick, 20 rounds"};
return `<div class="row" style="justify-content:flex-end;margin:0">${sndBtn()}</div><div class="tag">THE CRICKET TRUMP CARD GAME FOR 80s, 90s &amp; 2000s KIDS</div><h1 class="ti">STRAIGHT TO<br>THE PAVILION</h1><div class="st"></div><p class="sub">Pick your stat. Beat the table. Take every card.</p>
<div class="box">${acct()}
<label>PICK A FORMAT</label><div class="fmt">${Object.keys(D).map(k=>`<button class="b${k} ${k===mode?"on":""}" onclick="setMode('${k}')">${D[k].n.toUpperCase()}<small>${ds[k]}</small></button>`).join("")}</div>
<label>OPPONENTS</label><div class="seg">${[1,2,3].map(n=>`<button class="${n===nb?"on":""}" onclick="setNb(${n})">${n} BOT${n>1?"S":""}</button>`).join("")}</div>
${loadG()?`<div class="row"><button class="go" onclick="resumeG()">RESUME MATCH</button></div>`:""}<div class="row"><button class="go" onclick="startSP()">START MATCH</button><button disabled>MULTIPLAYER: SOON</button></div></div>
<div class="box"><h3>HOW TO PLAY</h3><p class="mu">60 cards a format, dealt evenly. The leader picks a stat on their top card and the best value wins every card on the table. Lowest wins for bowling average and economy, and no value loses. Tests: no clock, play until one player holds every card. ODIs: no clock, 50 rounds, most cards wins. T20Is: rush mode, 20 seconds to pick or a random stat is played, 20 rounds. Ties go to the tie pot, which the next round’s winner takes. Behind? Call a forfeit, and the leader decides.</p></div>
<div class="box"><h3>BETA TESTER?</h3><p class="mu">Found a bug or have an idea? Tell me.</p><button onclick="fbOpen()">SEND FEEDBACK</button></div>`}
function lobby(){return `<h1>Table <span style="color:var(--acc)">${esc(S.code)}</span></h1><p class="mu">Share this code with friends. ${D[S.mode].n} · ${S.ps.length}/6 players</p><div class="box">${S.ps.map(p=>`<div>• ${esc(p.name)}${p.id===me.id?" (you)":""}</div>`).join("")}
<div class="row">${H?`<button class="go" ${S.ps.length<2?"disabled":""} onclick="startMP()">Start game</button>`:`<span class="mu">Waiting for the host to start…</span>`}</div></div>`}
function game(){const d=D[S.mode],L=S.ps[S.lead],mine=S.ps.find(p=>p.id===me.id),my=L.id===me.id,r=S.rev;
let h=`<div class="top"><b>${d.n}</b><span>Round ${Math.min(S.rd,RULES[S.mode].cap||S.rd)}${RULES[S.mode].cap?" / "+RULES[S.mode].cap:""}</span><span>Tie pot: ${S.pot.length}</span></div><div class="pl">${S.ps.map(p=>`<div class="p ${p===L&&!S.over?"ld":""} ${p.hand.length?"":"out"}">${esc(p.name)}${p.id===me.id?" (you)":""}<br><span class="mini"></span><b>${p.hand.length}</b> cards</div>`).join("")}</div>`;
if(S.ph==="pick"){if(S.dl)h+=`<div class="tmr">TIME LEFT <b id="tm">${Math.max(0,Math.ceil((S.dl-Date.now())/1000))}</b>s</div>`;h+=`<div class="msg">${my?"Your lead — pick a stat":esc(L.name)+" is choosing…"}</div><div class="grid">${mine&&mine.hand.length?cd(mine.hand[0],{pick:my}):`<p class="mu">You’re out of cards — spectating.</p>`}</div>`}
else if(r){const w=r.w&&S.ps.find(p=>p.id===r.w);h+=`<div class="msg">${w?esc(w.name)+" wins "+r.n+" card"+(r.n>1?"s":"")+" on "+STS[S.mode][r.st][0]:"Tie on "+STS[S.mode][r.st][0]+" — cards go to the pot"}</div><div class="grid g2 ${r.vals.length%2?"odd":""}">${r.vals.map(x=>`<div class="cw"><span class="pn">${esc(S.ps.find(p=>p.id===x.id).name)}</span>${cd(x.c,{sel:r.st,win:x.id===r.w})}</div>`).join("")}</div>`}
if(S.over)h+=`<div class="ban">${S.how==="tied"?"Match tied!":esc(S.over)+" wins"+(S.how==="forfeit"?" by forfeit":S.how==="rounds"?" on cards":"")+"!"}</div><div class="row" style="justify-content:center">${H?`<button class="go" onclick="again()">Rematch</button>`:""}<button onclick="toMenu()">Menu</button></div>`;
else if(S.fo){const t=topP();h+=t&&t.id===me.id?`<div class="msg">${esc(S.fo.name)} calls a forfeit — accept and take the win?</div><div class="row bb"><button class="go" onclick="decFo(true)">Accept — I win</button><button onclick="decFo(false)">Decline</button></div>`:`<div class="msg">${esc(S.fo.name)} has called a forfeit — waiting for the leader’s decision…</div>`}

let snd=true,sndOn=false;try{snd=localStorage.getItem("sp-snd")!=="0"}catch(e){}
function sndPlay(){if(!snd){CA.pause();return}const p=CA.play();if(p&&p.then)p.then(()=>{sndOn=true}).catch(()=>{})}
function sndBtn(){return `<button class="snd" onclick="sndToggle()">SOUND: ${snd?"ON":"OFF"}</button>`}
function sndToggle(){snd=!snd;try{localStorage.setItem("sp-snd",snd?"1":"0")}catch(e){}sndPlay();document.querySelectorAll(".snd").forEach(b=>{b.textContent="SOUND: "+(snd?"ON":"OFF")})}
document.addEventListener("pointerdown",()=>{if(snd&&CA.paused)sndPlay()},{passive:true});
document.addEventListener("visibilitychange",()=>{if(document.hidden)CA.pause();else if(snd&&sndOn)sndPlay()});
let cur=LS.g("sp-cur")||"",view="",authM=0;
const users=()=>{try{return JSON.parse(LS.g("sp-users")||"{}")}catch(e){return{}}},saveU=u=>LS.s("sp-users",JSON.stringify(u));
async function hashPw(salt,pw){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(salt+":"+pw));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){let h=0;for(const ch of salt+pw)h=(h*31+ch.charCodeAt(0))|0;return"x"+h}}
function acct(){return cur?`<label>PLAYING AS ${esc(cur).toUpperCase()}</label><input id="nm" maxlength="14" value="${esc(me.name)}" placeholder="Display name"><div class="row"><button onclick="goV('stats')">MY STATS</button><button onclick="logout()">LOG OUT</button></div>`:`<label>YOUR NAME</label><input id="nm" maxlength="14" value="${esc(me.name)}" placeholder="Name"><div class="row"><button onclick="goV('auth')">LOG IN OR SIGN UP</button></div><p class="mu">Log in to keep your name and stats on this device.</p>`}
function goV(v){nameIn();view=v;render()}
function backV(){view="";render()}
function authSet(i){authM=i;view="auth";render()}
function authView(){return `<h1 class="ti" style="font-size:clamp(14px,4.2vw,24px)">${authM?"CREATE ACCOUNT":"LOG IN"}</h1><div class="box"><div class="seg"><button class="${authM?"":"on"}" onclick="authSet(0)">LOG IN</button><button class="${authM?"on":""}" onclick="authSet(1)">CREATE ACCOUNT</button></div>
<label>USERNAME</label><input id="au" maxlength="16" autocapitalize="none" autocomplete="username" placeholder="3 to 16 letters or numbers">
<label>PASSWORD</label><input id="ap" type="password" maxlength="40" autocomplete="${authM?"new-password":"current-password"}" placeholder="At least 4 characters">
<div class="row"><button class="go" onclick="authGo()">${authM?"CREATE":"LOG IN"}</button></div><p id="am" class="mu"></p><p class="mu">Accounts are saved on this device for now. Keep it simple: this is a fun game, not a bank.</p></div>`}
async function authGo(){const u=($("au").value||"").trim().toLowerCase(),p=$("ap").value||"",m=$("am");
if(!/^[a-z0-9_]{3,16}$/.test(u)){m.textContent="Username: 3 to 16 letters, numbers or _.";return}if(p.length<4){m.textContent="Password needs at least 4 characters.";return}
const all=users();
if(authM){if(all[u]){m.textContent="That username is taken.";return}const salt=Math.random().toString(36).slice(2);all[u]={s:salt,h:await hashPw(salt,p),name:me.name||u,stats:{}};saveU(all)}
else{if(!all[u]||all[u].h!==await hashPw(all[u].s,p)){m.textContent="Wrong username or password.";return}}
cur=u;LS.s("sp-cur",u);me.name=all[u].name||u;LS.s("sp-name",me.name);view="";render()}
function logout(){nameIn();cur="";LS.d("sp-cur");render()}
function statsView(){const u=users()[cur];if(!u)return"";const f=o=>o&&o.p?`${o.p} / ${o.w} (${Math.round(100*o.w/o.p)}%)`:"-";
const rows=["T","O","W"].map(k=>{const m=(u.stats||{})[k]||{};return `<div>${D[k].n}</div><div>${f(m.b)}</div><div>${f(m.m)}</div>`}).join("");
return `<h1 class="ti" style="font-size:clamp(14px,4.2vw,24px)">MY STATS</h1><div class="box"><p class="mu">${esc(cur)} · played / won (win rate)</p><div class="stt"><div class="h">FORMAT</div><div class="h">VS BOTS</div><div class="h">VS FRIENDS</div>${rows}</div></div>`}
function recordGame(){if(!cur||!S)return;const u=users();if(!u[cur])return;const st=u[cur].stats=u[cur].stats||{},m=st[S.mode]=st[S.mode]||{},k=R?"m":"b",o=m[k]=m[k]||{p:0,w:0,t:0};o.p++;if(S.how==="tied")o.t++;else if(S.winId===me.id)o.w++;saveU(u)}
function saveG(){if(!S||S.lobby||R)return;if(S.over)LS.d("sp-game");else LS.s("sp-game",JSON.stringify({S,mode,nb}))}
function loadG(){try{const g=JSON.parse(LS.g("sp-game")||"null");return g&&g.S&&!g.S.over?g:null}catch(e){return null}}
function resumeG(){const g=loadG();if(!g)return false;LS.d("sp-menu");S=g.S;mode=g.mode;nb=g.nb;H=true;R=null;if(S.ph==="pick"&&RULES[S.mode].tl)S.dl=Date.now()+RULES[S.mode].tl*1000;sync();return true}
function toMenu(){LS.s("sp-menu","1");location.reload()}
function boot(){if(cur&&!users()[cur]){cur="";LS.d("sp-cur")}const u=users()[cur];if(u)me.name=u.name||cur;if(loadG()&&!LS.g("sp-menu")&&resumeG())return;render()}
